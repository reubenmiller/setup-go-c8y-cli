name: 'test'
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - v2
      - 'releases/*'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [latest, v2.39.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install (version=${{ matrix.version }})
        uses: ./
        with:
          version: ${{ matrix.version }}
          showVersion: 'true'
          showTenant: 'false'

      - name: Binary is on PATH
        shell: bash
        run: which c8y || command -v c8y

      - name: Version output is non-empty
        shell: bash
        run: |
          out=$(c8y version --output table)
          echo "$out"
          [ -n "$out" ]

      - name: Cache hit on second install
        uses: ./
        with:
          version: ${{ matrix.version }}
          showVersion: 'false'
          showTenant: 'false'

      # Binary extensions need go-c8y-cli v2.57.0 or later
      - name: Install extension (pinned)
        if: ${{ matrix.version == 'latest' }}
        uses: ./
        with:
          version: ${{ matrix.version }}
          showVersion: 'false'
          showTenant: 'false'
          extensions: |
            # comments and blank lines are ignored
            reubenmiller/c8y-tenant-sync@v0.10.5

      - name: Extension command runs
        if: ${{ matrix.version == 'latest' }}
        shell: bash
        run: |
          out=$(c8y tenant-sync --version </dev/null)
          echo "$out"
          [[ "$out" == *0.10.5* ]]

      - name: Install extension again (already installed)
        if: ${{ matrix.version == 'latest' }}
        uses: ./
        with:
          version: ${{ matrix.version }}
          showVersion: 'false'
          showTenant: 'false'
          extensions: reubenmiller/c8y-tenant-sync@v0.10.5

      - name: Replace extension with the latest release
        if: ${{ matrix.version == 'latest' }}
        uses: ./
        with:
          version: ${{ matrix.version }}
          showVersion: 'false'
          showTenant: 'false'
          extensions: https://github.com/reubenmiller/c8y-tenant-sync
