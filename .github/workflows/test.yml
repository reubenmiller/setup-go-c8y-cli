name: 'test'
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - v2
      - 'releases/*'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [latest, v2.39.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install (version=${{ matrix.version }})
        uses: ./
        with:
          version: ${{ matrix.version }}
          showVersion: 'true'
          showTenant: 'false'

      - name: Binary is on PATH
        shell: bash
        run: which c8y || command -v c8y

      - name: Version output is non-empty
        shell: bash
        run: |
          out=$(c8y version --output table)
          echo "$out"
          [ -n "$out" ]

      - name: Cache hit on second install
        uses: ./
        with:
          version: ${{ matrix.version }}
          showVersion: 'false'
          showTenant: 'false'
