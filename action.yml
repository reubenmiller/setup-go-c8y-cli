name: 'setup-go-c8y-cli'
description: 'Cache and install the go-c8y-cli binary (c8y) to $PATH'
author: reubenmiller
inputs:
  version:
    required: false
    description: go-c8y-cli version to setup
    default: latest
  showVersion:
    required: false
    description: Show cli version
    default: "true"
  showTenant:
    required: false
    description: Show tenant information
    default: "true"
  extensions:
    required: false
    description: |
      go-c8y-cli extensions to install, one per line (or separated by commas or spaces).
      Each entry is a repository (owner/repo or a URL), optionally followed by @<release tag or commit ref>,
      e.g. reubenmiller/c8y-tenant-sync@v0.10.5. Without a ref, the latest release is installed.
    default: ""
  token:
    required: false
    description: GitHub token used when installing extensions, to avoid GitHub API rate limits
    default: ${{ github.token }}
outputs:
  c8y:
    description: Path to the c8y binary
    value: ${{ steps.install.outputs.c8y }}
runs:
  using: composite
  steps:
    - name: Resolve version
      id: resolve
      shell: bash
      run: |
        version="${{ inputs.version }}"
        if [ "$version" = "latest" ]; then
          version=$(curl -sSfI https://github.com/reubenmiller/go-c8y-cli/releases/latest \
            | grep -i '^location:' | awk -F/ '{print $NF}' | tr -d '\r\n')
        fi
        # Normalize: ensure version always has a v prefix
        case "$version" in
          v*) ;;
          *)  version="v${version}" ;;
        esac
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache c8y binary
      uses: actions/cache@v6
      with:
        path: ~/.c8y
        key: c8y-${{ steps.resolve.outputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install c8y
      id: install
      shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
      run: |
        case "${{ runner.os }}" in
          Linux)   os=linux   ;;
          macOS)   os=macOS   ;;
          Windows) os=windows ; ext=.exe ;;
        esac
        case "${{ runner.arch }}" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          ARM)   arch=armv7 ;;
        esac
        dir="${HOME}/.c8y/${VERSION}"
        binary="${dir}/c8y${ext:-}"
        if [ ! -f "$binary" ]; then
          mkdir -p "$dir"
          url="https://github.com/reubenmiller/go-c8y-cli/releases/download/${VERSION}/c8y_${os}_${arch}${ext:-}"
          curl -sSfL "$url" -o "$binary"
          chmod +x "$binary"
        fi
        echo "${dir}" >> "$GITHUB_PATH"
        echo "c8y=${binary}" >> "$GITHUB_OUTPUT"

    - name: Install extensions
      if: ${{ inputs.extensions != '' }}
      shell: bash
      env:
        C8Y_BIN: ${{ steps.install.outputs.c8y }}
        EXTENSIONS: ${{ inputs.extensions }}
        GH_TOKEN: ${{ inputs.token }}
        # Fail instead of prompting for credentials when a repository can't be cloned
        GIT_TERMINAL_PROMPT: "0"
      run: |
        set -euo pipefail
        # c8y is not on PATH until the next step, so call it by its full path.
        # stdin is closed so that c8y does not wait for piped input.
        c8y() { "$C8Y_BIN" "$@" </dev/null; }

        # Entries are separated by new lines, commas or spaces; "#" starts a comment
        entries=$(printf '%s\n' "$EXTENSIONS" | sed 's/#.*//' | tr ', \t' '\n\n\n' | sed '/^$/d')

        for entry in $entries; do
          # Split off the ref after the last "@", unless the "@" is part of the
          # repository address (e.g. git@github.com:owner/repo)
          repo="$entry"
          ref=""
          case "$entry" in
            *@*)
              if [[ "${entry%@*}" == */* ]]; then
                repo="${entry%@*}"
                ref="${entry##*@}"
              fi
              ;;
          esac

          # Extensions from github.com are listed as owner/repo
          key="${repo#https://github.com/}"
          key="${key#http://github.com/}"
          key="${key%/}"
          key="${key%.git}"

          echo "::group::Install extension ${repo}${ref:+ (${ref})}"
          # The list command fails (and logs an error) when no extensions are installed
          installed=$(c8y extensions list --filter "repo eq ${key}" --select name,version -o csv 2>/dev/null || true)
          if [ -n "$installed" ]; then
            name="${installed%%,*}"
            version="${installed#*,}"
            if [ -n "$ref" ] && [ "$version" = "$ref" ]; then
              echo "Extension ${name} ${version} is already installed"
              echo "::endgroup::"
              continue
            fi
            # Installing over an existing extension fails, so replace it
            echo "Replacing installed extension ${name} ${version}"
            c8y extensions delete "$name"
          fi

          args=(extensions install "$repo")
          if [ -n "$ref" ]; then
            args+=(--pin "$ref")
          fi
          c8y "${args[@]}"
          echo "::endgroup::"
        done

        c8y extensions list --select name,version,repo -o table

    - name: Show version
      if: ${{ inputs.showVersion == 'true' }}
      shell: bash
      run: c8y version --output table

    - name: Show tenant
      if: ${{ inputs.showTenant == 'true' }}
      shell: bash
      run: c8y sessions get -o json --select host,tenant,version || true
